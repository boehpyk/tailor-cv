# Alembic configuration. The database URL is NOT here — it comes from settings at runtime
# (alembic/env.py), because the one place this codebase reads the environment is the settings object
# and a URL duplicated into an ini file is a URL that will disagree with it one day.
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# Timestamped, ordered filenames: `20260904_1432-a1b2c3_add_base_cv.py` sorts chronologically in a
# directory listing, which a bare revision hash does not.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
