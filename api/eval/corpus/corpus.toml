# The prompt eval corpus manifest. EVERYTHING HERE IS SYNTHETIC -- see README.md (AC-26).
#
# [[cv]]       id, file, candidate_name: the candidate's name as the CV states it (any case; no
#              credentials such as ", RN"). Both tailored documents must name it -- the name-fidelity
#              check. organisations: every organisation the CV's text names, short forms included.
#              The loader refuses a declared name or organisation the text does not contain, and a CV
#              text naming another entry's organisation without declaring it.
# [[posting]]  id, file, title, company, aliases: short forms of the company the text uses.
# [[pair]]     id, cv, posting, watch_for: what a human reader should look for in this pair.

