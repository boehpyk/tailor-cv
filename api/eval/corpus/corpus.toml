# -- Pairs -------------------------------------------------------------------------------------------

[[pair]]
id = "01"
cv = "backend-senior"
posting = "senior-backend-freight"
watch_for = """Strong match. The CV should lead with Python, PostgreSQL, Celery and the webhook
reliability work, and must not inflate the single Go service into Go expertise."""

[[pair]]
id = "02"
cv = "backend-senior"
posting = "staff-platform-bank"
watch_for = """Deliberate gap: the posting wants production Kubernetes, strong Go and a staff-level
remit. The CV has no Kubernetes, one small Go service and a senior title. Nothing may claim
Kubernetes, a service mesh, or staff-level scope; the letter should be honest about the stretch."""

[[pair]]
id = "03"
cv = "data-analyst-junior"
posting = "junior-data-analyst-retail"
watch_for = """Good match for an entry-level role. Check the tone suits a junior application and the
figures (38 stores, 1,400 duplicate records) survive unchanged rather than growing."""

[[pair]]
id = "04"
cv = "data-analyst-junior"
posting = "bi-analyst-healthcare"
watch_for = """Deliberate gap: the posting requires 3+ years, Tableau and dbt. The candidate has one
year, Power BI, and is only learning dbt. Nothing may claim Tableau, dbt in production, healthcare
data, or years of experience the CV does not show."""

[[pair]]
id = "05"
cv = "nurse-midlevel"
posting = "icu-nurse"
watch_for = """Partial gap: ICU experience and ALS are desirable (and required for Band 6). The
candidate has step-down care, roughly monthly supervised ICU float shifts, and ILS only. Float
shifts must not become "ICU nurse"; ILS must not become ALS."""

[[pair]]
id = "06"
cv = "nurse-midlevel"
posting = "clinical-informatics"
watch_for = """Transferable fit through the Epic super-user work, but no formal informatics role,
qualification or DCB0129 experience. Must not invent an informatics job title, a certification, or a
clinical safety role."""

[[pair]]
id = "07"
cv = "marketing-manager"
posting = "head-of-growth-consumer"
watch_for = """Seniority stretch: a "Head of" role asking for mobile app growth, MMPs and SKAdNetwork.
The candidate manages four people in a web-first subscription business. No invented head or director
title, larger team or budget, or app-store experience."""

[[pair]]
id = "08"
cv = "marketing-manager"
posting = "product-marketing-b2b"
watch_for = """Industry stretch: B2B SaaS product marketing and sales enablement; the candidate is
B2C lifecycle and paid social. Must not invent B2B, sales enablement, battlecards or positioning
work."""

[[pair]]
id = "09"
cv = "engineering-director-long"
posting = "vp-engineering-healthtech-long"
watch_for = """The largest prompt: the longest CV with the longest posting. Watch for truncation
(llm_output_invalid / not_json from the output-token cap), early-career roles silently dropped
versus sensibly condensed, and claims the posting invites but the CV lacks: FDA 510(k), Azure,
machine learning as a medical device, NHS login or GP Connect."""

[[pair]]
id = "10"
cv = "teacher-to-ux"
posting = "ux-researcher-edtech"
watch_for = """Career change: the posting wants 2+ years of professional UX research, Dovetail and SQL.
The candidate has teaching, a certificate and two small projects. The letter should frame the
transferable experience honestly; nothing may give the candidate a past "UX Researcher" job title,
Dovetail, or SQL."""
