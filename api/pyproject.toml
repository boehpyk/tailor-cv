[project]
name = "tailorcraft"
version = "0.1.0"
description = "AI-powered CV and cover-letter customizer"
requires-python = ">=3.13"

# Runtime dependencies only. Feature libraries (WeasyPrint, trafilatura, google-genai) are added by
# the slice that first needs them — a dependency nothing imports is install time, attack surface and
# upgrade work bought in advance for no one. `pypdf` and `python-docx` are the first two: they arrive
# with `intake-base-cv-upload` (T20), the slice that first needs to read a CV.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    "sentry-sdk[fastapi,celery]>=2.19",
    "pypdf>=5.1",
    # Imported by exactly one module: tailorcraft.infrastructure.export.docx.
    "python-docx>=1.1",
    # FastAPI's own multipart parser (Starlette's `request.form()`) is a thin wrapper over this
    # library and raises at import time without it — required as of T24, the first endpoint that
    # accepts `multipart/form-data` (the CV upload).
    "python-multipart>=0.0.20",
    # The guarded egress (ADR-0012) and the job-posting extractor, added by slice 1.2 — the first
    # slice that reaches OUT of this process to a host a stranger chose.
    #
    # `httpx` moved here from `[dependency-groups] dev` in the same commit. It was test-only (the
    # ASGI client), and importing it from runtime code while it is a dev dependency works perfectly
    # on a developer's machine and breaks the production image, where dev groups are not installed.
    # A small, real footgun; it gets named rather than silently fixed.
    "httpx>=0.28",
    # Pulls `lxml`, which ships manylinux wheels for cp313 — so no apt package is expected on
    # python:3.13-slim. That is a prediction, and T32 verifies it by building the image and running
    # the extractor inside it. If a wheel turns out to be missing and uv falls back to a source
    # build, the fix is libxml2-dev + libxslt1-dev + a compiler in docker/api/Dockerfile AND in
    # .github/workflows/ci.yml, in the same commit — the WeasyPrint lesson, where the import
    # succeeds and the first *use* fails, in the container nobody is watching.
    "trafilatura>=2.0",
    # The Google Gemini SDK — the first (and so far only) adapter behind `LlmPort`, added by the
    # slice that first asks a model for anything. It is imported in exactly ONE file,
    # `infrastructure/llm/gemini.py`; ADR-0004's "swapping providers is one adapter and one binding"
    # is true only while that stays so, which is why `google` is in the forbidden lists of BOTH
    # import-linter contracts below (see the note there) rather than left to code review.
    #
    # Wheels all the way down on cp313 — no apt package, nothing to mirror into
    # docker/api/Dockerfile or .github/workflows/ci.yml. It does drag in `google-auth` (hence
    # `cryptography`), `requests`, `tenacity` and `websockets`; none of those are ours to import
    # either, and `requests` was already on both forbidden lists. Note the resolver DOWNGRADED
    # `websockets` 17.1 -> 16.1.1 to satisfy `google-genai`'s `websockets<17.0` — it is a transitive
    # dependency of `uvicorn[standard]`, which accepts the older version, so this is a real
    # constraint on our web server picked up from an unrelated library. Worth remembering the next
    # time a `uv lock` moves a package nobody named.
    "google-genai>=2.23",
    # The rendering pipeline (ADR-0017) — Markdown to normalized tokens to sanitized HTML to PDF,
    # the same tokens to DOCX and plain text. Added by slice 1.5, the slice that first renders a
    # tailored document to a downloadable file.
    #
    # Imported by exactly one module: tailorcraft.infrastructure.export.pdf.
    "weasyprint>=63",
    # Imported by exactly one module: tailorcraft.infrastructure.export.tokens.
    "markdown-it-py>=3.0",
    # Imported by exactly one module: tailorcraft.infrastructure.export.html.
    "nh3>=0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # NOTE: httpx is NOT here any more — it is a runtime dependency as of slice 1.2 (see above).
    "watchdog>=6.0",          # provides `watchmedo`, the worker's dev auto-restart
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tailorcraft"]

# ---------------------------------------------------------------------------
# Ruff — lint + format. One tool, so there is nothing to keep in step.
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "UP",         # pyupgrade
    "B",          # bugbear
    "C4",         # comprehensions
    "SIM",        # simplify
    "TC",         # type-checking blocks
    "RUF",        # ruff's own
    "ASYNC",      # blocking calls in async functions — see ADR-0005
    "S",          # bandit-ish security checks
    "PT",         # pytest style
    "ANN",        # every signature is annotated (mypy --strict wants this anyway)
]
ignore = [
    "ANN401",     # `Any` is banned by review, not by a rule that fires on **kwargs
    "S101",       # assert: fine in tests, and `pytest` is built on it
    # E501 is off because `ruff format` already owns the width of every line of CODE. What is left
    # is prose — docstrings and comments — and a linter cannot rewrap prose safely: it will happily
    # split an f-string across two lines and hand you a syntax error. (Asked for empirically, once.)
    # The 100-column convention still holds for prose; it is enforced by reading, not by the build.
    "E501",
    # TC001/TC002/TC003 want imports that are "only used in annotations" moved into an
    # `if TYPE_CHECKING:` block. That is wrong here and the failure is not subtle: FastAPI, Pydantic
    # and SQLAlchemy all resolve annotations at RUNTIME — FastAPI calls `get_type_hints()` to work
    # out what to inject, Pydantic builds validators from them. Hide `AsyncEngine` or `SettingsDep`
    # behind TYPE_CHECKING and dependency injection breaks at import time, with a NameError at
    # startup rather than a lint warning. The rest of the TC group (unquoted annotations, runtime
    # imports inside a type-checking block) still applies and stays on.
    "TC001", "TC002", "TC003",
]

[tool.ruff.lint.per-file-ignores]
# Tests may hard-code obviously fake credentials and skip some annotations.
"tests/**" = ["S105", "S106", "ANN"]
"alembic/**" = ["ANN", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["tailorcraft"]

# ---------------------------------------------------------------------------
# mypy — strict everywhere, including tests. A test with a type error is a test
# that may not be asserting what it looks like it asserts.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "alembic"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# kombu is Celery's messaging layer and ships no py.typed either. One import, in
# `infrastructure/tasks/app.py`: `Queue`, to declare the named queues the worker
# consumes. Everything else that touches the broker goes through Celery's own API.
[[tool.mypy.overrides]]
module = ["kombu.*"]
ignore_missing_imports = true

# trafilatura ships no type information (no py.typed, no stubs on typeshed). The import is confined
# to `infrastructure/posting/fetching.py`, which wraps every call in its own typed helper, so the
# untyped surface stops at that module rather than spreading through the codebase.
[[tool.mypy.overrides]]
module = ["trafilatura.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# BOTH scopes are session, and they must agree. An asyncpg connection is bound to the event loop it
# was created on, so a session-scoped engine plus a per-test loop (pytest-asyncio's default) gives
# you `RuntimeError: got Future attached to a different loop` on teardown — from tests that
# individually pass and only fail when run together. Found by running the suite, not by reading it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: exercises a real renderer or a large fixture corpus",
]

# ---------------------------------------------------------------------------
# import-linter — the hexagonal boundary (ADR-0002).
#
# Two contracts do two different jobs and neither replaces the other:
#   1. `layers` catches an UPWARD import between our own layers.
#   2. `forbidden` catches a named third-party package reaching `domain`.
#
# The forbidden list is explicit, so it only knows about packages we thought to
# name. The default-deny backstop is `tests/unit/test_domain_purity.py`, which
# walks every import in `domain/` and rejects anything that is not the standard
# library — that one needs no maintenance and catches a dependency added
# tomorrow by someone who never read this file.
#
# `google` is the Gemini SDK entry, and it is deliberately the bare namespace
# package rather than `google.genai` (AC-6). The narrower string does not work:
# with `include_external_packages`, grimp squashes every external package into
# its top-level module, so import-linter rejects the config outright —
#
#     Invalid forbidden module google.genai: subpackages of external packages
#     are not valid.
#
# Verified empirically: with `import google.genai` planted in `domain/` and
# `from google import genai` planted in `application/`, both contracts report
# BROKEN with `-> google`, and both go back to KEPT when the imports are
# removed. Both spellings are caught, which is the point — an SDK import
# outside `infrastructure/llm/` is now a red gate, not a review note (ADR-0004).
#
# The breadth costs nothing here: `google` is a namespace package shared with
# `google.auth` and `google.oauth2` (pulled in transitively by the SDK), and
# neither `domain` nor `application` has any business importing those either.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["tailorcraft"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers: infrastructure -> application -> domain"
type = "layers"
layers = [
    "tailorcraft.infrastructure",
    "tailorcraft.application",
    "tailorcraft.domain",
]

[[tool.importlinter.contracts]]
name = "Domain imports no framework or vendor"
type = "forbidden"
source_modules = ["tailorcraft.domain"]
forbidden_modules = [
    "fastapi", "starlette", "pydantic", "pydantic_settings",
    "sqlalchemy", "alembic", "asyncpg",
    "celery", "redis", "kombu",
    "httpx", "requests", "structlog", "sentry_sdk",
    "google",
    "weasyprint", "nh3", "markdown_it", "docx",
]

[[tool.importlinter.contracts]]
name = "Application imports no framework or vendor"
type = "forbidden"
source_modules = ["tailorcraft.application"]
forbidden_modules = [
    "fastapi", "starlette", "pydantic", "pydantic_settings",
    "sqlalchemy", "alembic", "asyncpg",
    "celery", "redis", "kombu",
    "httpx", "requests", "sentry_sdk",
    "google",
    "weasyprint", "nh3", "markdown_it", "docx",
]
