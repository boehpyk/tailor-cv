# Development. Same shape as production so the integrated app at http://localhost:8080 behaves the
# way the deployed one does — but proxying to the Vite dev server instead of serving a built bundle,
# so hot reload survives the trip through nginx.
#
# Use :8080 (through here) when you care about same-origin behaviour — cookies, the /api path, auth.
# Use :5173 (Vite direct) when you only care about the UI. They are not interchangeable, and a bug
# that appears on one and not the other is almost always a cookie or an origin.

upstream api {
    server api:8000;
}

upstream vite {
    server web:5173;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health/ {
        proxy_pass http://api;
        access_log off;
    }

    location / {
        proxy_pass http://vite;

        # THE FOUR HEADERS ABOVE ARE REPEATED HERE ON PURPOSE. nginx inherits `proxy_set_header`
        # from an outer block only if the current block sets NONE of its own — add a single
        # `proxy_set_header` here and every server-level one is silently dropped. That is not a
        # style choice, it is the whole directive class turning off.
        #
        # Cost, paid once: with only Upgrade/Connection set below, `Host` fell back to nginx's
        # default of `$proxy_host` — the literal upstream name, `vite` — and Vite 6 refused the
        # request with "Blocked request. This host (\"vite\") is not allowed." The obvious-looking
        # fix is to add `vite` to Vite's allowedHosts, which would have papered over a proxy
        # misconfiguration and left X-Forwarded-* missing too. Send the right Host instead.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite's HMR runs over a WebSocket. Without these two, hot reload silently stops working
        # through nginx and you edit files that never appear in the browser.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
