# Development. Same shape as production so the integrated app at http://localhost:8080 behaves the
# way the deployed one does — but proxying to the Vite dev server instead of serving a built bundle,
# so hot reload survives the trip through nginx.
#
# Use :8080 (through here) when you care about same-origin behaviour — cookies, the /api path, auth.
# Use :5173 (Vite direct) when you only care about the UI. They are not interchangeable, and a bug
# that appears on one and not the other is almost always a cookie or an origin.

upstream api {
    server api:8000;
}

upstream vite {
    server web:5173;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health/ {
        proxy_pass http://api;
        access_log off;
    }

    location / {
        proxy_pass http://vite;
        # Vite's HMR runs over a WebSocket. Without these two headers hot reload silently stops
        # working through nginx and you edit files that never appear.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
