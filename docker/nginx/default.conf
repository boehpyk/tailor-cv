# Production. Traefik terminates TLS in front of this and reaches it over the shared `traefik`
# network; Traefik must be started with --providers.docker.network=traefik or routing intermittently
# targets the wrong container IP and you get a silent 30-second 504 (infrastructure.md footgun #1).

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # An uploaded CV is the largest thing a user sends. Cap it here as well as in the application:
    # nginx rejecting a 200 MB body costs nothing, while the same body reaching Python costs a worker.
    client_max_body_size 12M;

    # Do NOT enable ngx_http_realip_module here. It rewrites $remote_addr, which is what gets passed
    # upstream, and then the application's own proxy-trust logic compares the wrong address against
    # the wrong list. One layer reconstructs the client IP, not two. This nginx forwards the headers
    # and lets the app decide.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api;
        # The tailoring call has a 15-second budget and a longer hard ceiling (Constitution §7).
        # nginx's 60s default would cut a slow-but-succeeding generation off at the knees and present
        # it to the user as a 504 with no explanation.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health/ {
        proxy_pass http://api;
        access_log off;
    }

    # Hashed asset filenames — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: React Router owns the client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
