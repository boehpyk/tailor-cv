name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Automatic on merge: build the immutable images and push to GHCR. Production never builds.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
            ghcr.io/${{ github.repository }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Manual gate: bound to the `production` Environment. Add a required reviewer on that Environment
  # in GitHub settings — that approval IS the gate. Prod pulls the images; it never builds.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Ship the non-secret runtime config. The application ships inside the images; only the compose
      # file and the nginx conf need to live on the host. The prod .env is created on the box by
      # hand, once, and is never shipped from CI.
      - name: Sync compose + nginx config to the VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          source: "docker-compose.yml,docker/nginx/default.conf"
          target: /home/boehpyk/www/tailor-cv

      - name: Release over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          envs: GITHUB_SHA,GITHUB_REPOSITORY,GITHUB_ACTOR
          script: |
            set -euo pipefail
            cd /home/boehpyk/www/tailor-cv

            export API_IMAGE="ghcr.io/${GITHUB_REPOSITORY}-api:${GITHUB_SHA}"
            export WEB_IMAGE="ghcr.io/${GITHUB_REPOSITORY}-web:${GITHUB_SHA}"

            # Persist the deployed tags into .env so a hand-run `docker compose` on the box targets
            # the images that are actually deployed, instead of defaulting to :local and trying to
            # build from a context that was never shipped. Rewrite via a temp file + `cat >` so .env
            # keeps its 600 perms and its owner.
            tmp="$(mktemp)"
            grep -vE '^(TAILORCRAFT_API_IMAGE|TAILORCRAFT_WEB_IMAGE)=' .env > "$tmp" || true
            echo "TAILORCRAFT_API_IMAGE=${API_IMAGE}" >> "$tmp"
            echo "TAILORCRAFT_WEB_IMAGE=${WEB_IMAGE}" >> "$tmp"
            cat "$tmp" > .env
            rm -f "$tmp"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # EVERY container that runs application code is pulled. In the previous project the
            # background worker was missing from this line and ran a stale image for four releases;
            # the only symptom was behaviour that did not match the source. Here that is api, worker
            # and beat. A fourth daemon means a fourth entry here AND in the verification loop below.
            docker compose pull api worker beat web

            # A dump BEFORE anything changes, taken by the script rather than remembered by a person.
            # The datastores are brought up first so this also works on the very first deploy, when
            # nothing is running yet. The dump holds every guest's CV, so the directory is 700 and
            # the files 600, and only the newest ten are kept — a PII copy nobody needs is a liability,
            # not a backup. This is the database only: the uploads volume is not in here (ADR-0006).
            docker compose up -d --wait postgres redis
            umask 077
            mkdir -p backups
            dump="backups/pre-deploy_$(date -u +%Y%m%dT%H%M%SZ)_${GITHUB_SHA:0:12}.dump"
            docker compose exec -T postgres sh -c \
              'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc --no-owner --no-privileges' > "$dump.part"
            mv "$dump.part" "$dump"
            ls -1t backups/pre-deploy_*.dump | tail -n +11 | xargs -r rm --

            # Publish the new frontend bundle, then bring up the API.
            docker compose up -d web
            docker compose up -d api nginx

            # Stopped for the migration window rather than restarted after it: these are the two
            # processes that keep executing application code while the schema changes underneath
            # them. Celery finishes the task in flight on SIGTERM; queued work waits in Redis.
            docker compose stop worker beat
            docker compose exec -T api alembic upgrade head
            # Started last, on the new image, against the migrated schema.
            docker compose up -d worker beat

            # Prove it rather than hope. A stale container is invisible from the outside, which is
            # exactly why that bug survived four releases last time. Fail loudly instead of
            # succeeding quietly with a container running last month's code.
            for svc in api worker beat; do
              running="$(docker compose ps -q "$svc" | xargs -r docker inspect -f '{{.Config.Image}}')"
              if [ "$running" != "$API_IMAGE" ]; then
                echo "::error::$svc is running '$running', expected '$API_IMAGE'"
                exit 1
              fi
            done

            # Right image is half of it: a worker that consumes the wrong queues is green on
            # /health/ready (it still answers ping) while every run or export queues for ever.
            # The expected list is create_celery()'s task_queues — see docs/cicd.md's queue table.
            # Retried because a just-started worker has not joined the broker yet.
            queues=""
            for _ in $(seq 1 10); do
              queues="$(docker compose exec -T worker \
                celery -A tailorcraft.infrastructure.tasks.app inspect active_queues 2>&1 || true)"
              missing=""
              for q in celery tailoring export; do
                # Anchored on the entry's opening `* {'name':` — the exchange is ALSO named 'celery',
                # so an unanchored match would report the default queue present when it is not.
                grep -Eq "^[[:space:]]*\* \{'name': '${q}'" <<<"$queues" || missing="$missing $q"
              done
              [ -z "$missing" ] && break
              sleep 3
            done
            if [ -n "$missing" ]; then
              echo "::error::worker is not consuming:${missing}"
              echo "$queues"
              exit 1
            fi

      # /health/ready probes Postgres, Redis AND Celery (ADR-0005). If it only probed the datastores,
      # this check would pass with every export silently queueing forever.
      - name: Smoke check
        run: curl -fsS --retry 5 --retry-delay 3 https://cv.samolit.com/health/ready
