name: CI

on:
  pull_request:
  push:
    branches: [main]

# The two jobs run in parallel because a Python failure and a TypeScript failure are independent
# news. The step list here must equal `make check` (docs/cicd.md) — that equality is a drift seam
# and it is the one CI mistake that is invisible: a flag added in one place and not the other gives
# a green pipeline that is not checking what you think it checks. Change both, same commit.
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tailorcraft_test
          POSTGRES_USER: tailorcraft
          POSTGRES_PASSWORD: tailorcraft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tailorcraft -d tailorcraft_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: "postgresql+asyncpg://tailorcraft:tailorcraft@127.0.0.1:5432/tailorcraft_test"
      TEST_DATABASE_URL: "postgresql+asyncpg://tailorcraft:tailorcraft@127.0.0.1:5432/tailorcraft_test"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      CELERY_BROKER_URL: "redis://127.0.0.1:6379/1"
      CELERY_RESULT_BACKEND: "redis://127.0.0.1:6379/2"
      JWT_SIGNING_KEY: "ci-only-not-a-real-key-0000000000"
      UPLOAD_DIR: "/tmp/tailorcraft-uploads"
      # GEMINI_API_KEY is deliberately NOT set. Tests drive the fake LlmPort (ADR-0004); a suite that
      # would silently start spending money the moment a key appeared is one secret away from a
      # surprise bill. If a test fails here for want of a key, the test is wrong, not the workflow.

    steps:
      - uses: actions/checkout@v4

      - name: WeasyPrint system libraries
        # PDF rendering needs Pango/Cairo/HarfBuzz at RUNTIME. Without them the import succeeds and
        # the first render fails — so an export test would fail here in a way that looks like a code
        # bug. Mirrors docker/api/Dockerfile; keep the two in step.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2 \
            libgdk-pixbuf-2.0-0 shared-mime-info fonts-dejavu-core

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Static analysis (mypy --strict)
        run: uv run mypy .

      # The hexagonal boundary (ADR-0002). This is the gate that keeps `domain/` pure; a contract
      # that silently matches nothing passes, so it runs from the same directory and virtualenv as
      # the code it is analysing.
      - name: Architecture boundaries (import-linter)
        run: uv run lint-imports

      - name: Migrations sanity (empty DB → head)
        run: uv run alembic upgrade head

      - name: Tests (pytest)
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Tests (Vitest)
        run: npx vitest run

      # A build failure is a deploy failure. Catching it here is the last chance before it becomes a
      # blank page in production.
      - name: Build
        run: npm run build
