# Development override — MUST be passed explicitly (never auto-loaded), which is the safety mechanism
# that keeps dev config (open ports, hot reload, debug logging) off production:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# All published ports bind to 127.0.0.1 only. Docker bypasses UFW — see infrastructure.md footgun #2.
services:
  api:
    build:
      target: development
    volumes:
      - ./api:/app                       # live-mounted source
      - uploads:/var/lib/tailorcraft/uploads
    environment:
      # Dev-ness is a property of *loading this override file*, not of a value someone copied into a
      # gitignored .env. The image bakes APP_ENV=production so the safe value is the default
      # everywhere; this line is what makes `make up.dev` a dev box. Compose's `environment:`
      # outranks `env_file:`, so it also wins over the root .env.
      APP_ENV: dev
      LOG_LEVEL: debug
      # The root .env's PUBLIC_BASE_URL/CORS_ORIGINS are `https://tailorcraft.app` — a production-
      # shaped value, safe as the `env_file:` default but wrong for a browser actually sitting at
      # http://localhost:8080 (the integrated dev app, behind nginx's dev.conf). AC-25's origin check
      # trusts PUBLIC_BASE_URL by construction (deps.py's `_trusted_origins` = {public_base_url} ∪
      # cors_origin_list) — that field exists precisely to name "the app's own origin", which in dev
      # *is* :8080, not "an extra trusted origin" the way CORS_ORIGINS means. Overriding CORS_ORIGINS
      # instead would also turn on CORSMiddleware for that origin (main.py), which dev does not need:
      # the browser loads both the UI and /api/* from :8080 through this same nginx, so the request is
      # same-origin and no preflight/CORS path is exercised at all — only the AC-25 Origin check is.
      # Since 2.5 the worker and beat pin it too (below): the worker builds the emailed links.
      # Same shape as APP_ENV: `environment:` outranks `env_file:`, so dev-ness follows this override
      # file rather than a value someone edited into the gitignored .env. This also happens to match
      # `Settings.public_base_url`'s own compiled-in default of "http://localhost:8080" — the .env
      # value is what overrides it away from that default; this line restores it for dev only.
      PUBLIC_BASE_URL: http://localhost:8080
      # Same shape again. `.env.example` defaults to 2 (Traefik, then nginx — the production chain),
      # but dev has only nginx in front of this process, so the trusted hop count here is 1. Get this
      # wrong and `client_ip` (infrastructure/rate_limit.py) keys every rate limiter on nginx's own
      # address instead of the developer's — a silent single-bucket collapse, the same failure shape
      # that hit every production IP limiter from Phase 1 through 2.1's `/verify`.
      TRUSTED_PROXY_HOPS: 1
      # Dev cannot mail strangers (2.5, AC-25): these outrank the root .env's `env_file:`, so
      # production-shaped MAIL_* credentials in a dev .env still deliver to Mailpit and nowhere else.
      # The sender is pinned too: the adapter refuses to render without one. The SMTP credentials
      # are pinned EMPTY so a real relay login in a dev .env is never sent as AUTH to Mailpit.
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_SMTP_SECURITY: none
      MAIL_FROM_ADDRESS: no-reply@tailorcraft.test
      MAIL_SMTP_USERNAME: ""
      MAIL_SMTP_PASSWORD: ""
    command: ["uvicorn", "tailorcraft.infrastructure.api.main:app",
              "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"            # direct API access for curl / OpenAPI docs

  worker:
    build:
      target: development
    volumes:
      - ./api:/app
      - uploads:/var/lib/tailorcraft/uploads
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug
      # The WORKER builds every emailed link (confirmation, reset) from PUBLIC_BASE_URL (2.5), so it
      # needs the same pin as the api: otherwise dev mail in Mailpit links to the .env's production
      # origin. Beat shares the image and settings, pinned for consistency.
      PUBLIC_BASE_URL: http://localhost:8080
      # Dev cannot mail strangers (2.5, AC-25): these outrank the root .env's `env_file:`, so
      # production-shaped MAIL_* credentials in a dev .env still deliver to Mailpit and nowhere else.
      # The sender is pinned too: the adapter refuses to render without one. The SMTP credentials
      # are pinned EMPTY so a real relay login in a dev .env is never sent as AUTH to Mailpit.
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_SMTP_SECURITY: none
      MAIL_FROM_ADDRESS: no-reply@tailorcraft.test
      MAIL_SMTP_USERNAME: ""
      MAIL_SMTP_PASSWORD: ""
    # No --max-tasks-per-child in dev: recycling hides the memory behaviour you may be trying to see.
    command: ["watchmedo", "auto-restart", "--directory=/app/src", "--pattern=*.py", "--recursive",
              "--", "celery", "-A", "tailorcraft.infrastructure.tasks.app", "worker",
              "--loglevel=debug", "--concurrency=1"]

  beat:
    build:
      target: development
    volumes:
      - ./api:/app
      # Keep beat's schedule database off the bind mount — see the base compose file.
      - beat_state:/var/lib/tailorcraft/state
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug
      # The WORKER builds every emailed link (confirmation, reset) from PUBLIC_BASE_URL (2.5), so it
      # needs the same pin as the api: otherwise dev mail in Mailpit links to the .env's production
      # origin. Beat shares the image and settings, pinned for consistency.
      PUBLIC_BASE_URL: http://localhost:8080
      # Dev cannot mail strangers (2.5, AC-25): these outrank the root .env's `env_file:`, so
      # production-shaped MAIL_* credentials in a dev .env still deliver to Mailpit and nowhere else.
      # The sender is pinned too: the adapter refuses to render without one. The SMTP credentials
      # are pinned EMPTY so a real relay login in a dev .env is never sent as AUTH to Mailpit.
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_SMTP_SECURITY: none
      MAIL_FROM_ADDRESS: no-reply@tailorcraft.test
      MAIL_SMTP_USERNAME: ""
      MAIL_SMTP_PASSWORD: ""

  # In dev this is the Vite dev server, not a build-and-exit container. Hot reload is the whole point
  # of the frontend feedback loop (ADR-0001).
  web:
    build:
      target: development
    volumes:
      - ./web:/app
      - /app/node_modules                # keep the container's installed modules, not the host's
    environment:
      NODE_ENV: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    restart: unless-stopped

  nginx:
    ports:
      - "127.0.0.1:8080:80"              # http://localhost:8080 — the integrated app
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    ports:
      - "127.0.0.1:5432:5432"            # 127.0.0.1 ONLY — never 0.0.0.0

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  # Dev mail catcher (2.5). Dev only: production's compose has no Mailpit. The web UI is published on
  # the loopback; SMTP (1025) is NOT published at all, it is reached as mailpit:1025 on the compose
  # network. Messages live in memory and vanish on restart, which is what a dev inbox should do.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"            # web UI + HTTP API; 127.0.0.1 ONLY
    restart: unless-stopped

volumes:
  beat_state:
